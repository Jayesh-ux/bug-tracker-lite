# Bug Tracker Lite - Nginx site config
# Serves the built SPA and reverse-proxies /api to the Node backend.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/bugtracker.conf
# IMPORTANT: replace server_name and the SPA root with your domain/paths.
#
# The SPA root must point at `frontend/dist` (after `npm run build`).

server {
    listen 80;
    server_name bugtracker.example.com;

    root /var/www/bugtracker-lite;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # S3 pre-signed image URLs are consumed by the browser directly (not proxied).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/docs {
        # Handled by the backend; belongs in the /api/ block, but nginx
        # prefers longer prefixes - this is just documentation of intent.
        proxy_pass http://127.0.0.1:4000;
    }

    # SPA fallback - every non-file route returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively (Vite emits content-hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}